apiVersion: v1
kind: ResourceQuota
metadata:
  name: shopsphere-resource-quota
  namespace: shopsphere-dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: shopsphere-limit-range
  namespace: shopsphere-dev
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "500m"
        memory: "512Mi"
