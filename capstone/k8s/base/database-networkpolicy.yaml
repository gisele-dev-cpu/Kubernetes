apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-backend-to-database
  namespace: shopsphere-dev

spec:
  podSelector:
    matchLabels:
      app: shopsphere-database

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: shopsphere-backend
      ports:
        - protocol: TCP
          port: 3306
