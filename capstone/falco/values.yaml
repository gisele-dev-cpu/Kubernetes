customRules:
  runtime-lab-rules.yaml: |
    - rule: Shell Execution in Runtime Lab
      desc: Detect any shell started in the runtime-lab namespace
      condition: >
        spawned_process and
        container and
        k8s.ns.name = runtime-lab and
        proc.name in (sh, bash, ash)
      output: >
        Shell execution detected
        (user=%user.name
        process=%proc.name
        command=%proc.cmdline
        pod=%k8s.pod.name
        namespace=%k8s.ns.name)
      priority: WARNING
      tags: [container, shell, custom_detection]
